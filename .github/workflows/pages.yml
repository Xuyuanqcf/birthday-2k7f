name: 发布生日网页到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.发布.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 第一次跑的时候，这个步骤会自动把仓库的 Pages 打开（enablement: true）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: 发布
        uses: actions/deploy-pages@v4
